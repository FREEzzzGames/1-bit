name: DarkMaze Cardputer ADV build

on:
  push:
    paths:
      - "firmware/DarkMaze/**"
      - ".github/workflows/darkmaze-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-darkmaze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Arduino sketch
        run: |
          mkdir -p firmware/DarkMaze
          base64 -d firmware/DarkMaze/DarkMaze.ino.gz.b64 | gzip -dc > firmware/DarkMaze/DarkMaze.ino
          test -s firmware/DarkMaze/DarkMaze.ino
          # Fix Arduino prototype generation for the custom In type.
          sed -i '/#include <M5Cardputer.h>/i struct In;' firmware/DarkMaze/DarkMaze.ino
          # Cardputer ADV needs the opposite landscape rotation for this sketch.
          sed -i 's/Display\.setRotation(1)/Display.setRotation(3)/' firmware/DarkMaze/DarkMaze.ino
          grep -q 'Display.setRotation(3)' firmware/DarkMaze/DarkMaze.ino

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Arduino indexes
        run: arduino-cli core update-index

      - name: Install ESP32 core
        run: arduino-cli core install esp32:esp32@3.2.1

      - name: Install Cardputer library
        run: arduino-cli lib install M5Cardputer

      - name: Compile DarkMaze for M5Stack Cardputer ADV
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:m5stack_cardputer \
            --warnings all \
            --output-dir build/DarkMaze \
            firmware/DarkMaze

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DarkMaze-Cardputer-ADV
          path: build/DarkMaze/*.bin
          if-no-files-found: error
          retention-days: 30
