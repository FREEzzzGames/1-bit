name: Build CardputerClock

on:
  push:
    paths:
      - "CardputerClock/**"
      - ".github/workflows/cardputer-clock-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cardputer-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install M5Stack ESP32 platform
        run: |
          arduino-cli core update-index --additional-urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core install m5stack:esp32 --additional-urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json

      - name: Install libraries
        run: |
          arduino-cli lib install M5Cardputer M5Unified M5GFX AnimatedGIF

      - name: Prepare isolated Arduino sketch (keep original source unchanged)
        run: |
          mkdir -p build-src/CardputerClock
          cp CardputerClock/CardputerClock.ino build-src/CardputerClock/CardputerClock.ino
          printf '#pragma once\nstruct P;\n' > build-src/CardputerClock/clock_types.h
          python3 CardputerClock/apply_setup_wizard.py
          sed -i '1i #include "clock_types.h"' build-src/CardputerClock/CardputerClock.ino

      - name: Compile CardputerClock for Cardputer ADV
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_cardputer:FlashSize=8M,PartitionScheme=default_8MB" \
            --warnings all \
            --output-dir build/CardputerClock \
            build-src/CardputerClock

      - name: Upload CardputerClock BIN
        uses: actions/upload-artifact@v4
        with:
          name: CardputerClock-Cardputer-ADV
          path: build/CardputerClock/*.bin
          if-no-files-found: error
          retention-days: 30
