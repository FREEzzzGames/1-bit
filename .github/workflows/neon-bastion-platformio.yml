name: Neon Bastion Cardputer ADV PlatformIO

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "platformio.ini"
      - "partitions_8mb.csv"
      - "firmware/NeonBastion/**"
      - ".github/workflows/neon-bastion-platformio.yml"
  pull_request:
    paths:
      - "platformio.ini"
      - "partitions_8mb.csv"
      - "firmware/NeonBastion/**"
      - ".github/workflows/neon-bastion-platformio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cardputer-adv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile for Cardputer ADV
        run: pio run -e cardputer_adv

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Bastion-Cardputer-ADV-PlatformIO
          path: |
            .pio/build/cardputer_adv/firmware.bin
            .pio/build/cardputer_adv/bootloader.bin
            .pio/build/cardputer_adv/partitions.bin
          if-no-files-found: error
          retention-days: 30
