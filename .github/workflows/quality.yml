name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game runtime syntax
        run: node --check assets/game.js
      - name: Check skin module syntax
        run: node --check assets/skins.js
      - name: Check launcher syntax
        run: node --check assets/console-menu.js
      - name: Check new game runtime syntax
        run: node --check assets/arcade-extras.js
      - name: Check architecture invariants
        run: node tests/architecture-check.mjs
