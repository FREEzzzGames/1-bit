name: Neon Bastion Cardputer ADV build

on:
  push:
    paths:
      - "firmware/NeonBastion/**"
      - ".github/workflows/neon-bastion-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Update Arduino indexes
        run: arduino-cli core update-index
      - name: Install ESP32 core
        run: arduino-cli core install esp32:esp32@3.2.1
      - name: Install Cardputer library
        run: arduino-cli lib install M5Cardputer
      - name: Compile Neon Bastion
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:m5stack_cardputer \
            --warnings all \
            --output-dir build/NeonBastion \
            firmware/NeonBastion
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Bastion-Cardputer-ADV
          path: build/NeonBastion/*.bin
          if-no-files-found: error
          retention-days: 30
