name: Neon Bastion Cardputer ADV build

on:
  push:
    paths:
      - "firmware/NeonBastion/**"
      - ".github/workflows/neon-bastion-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install M5Stack board package
        run: |
          arduino-cli core update-index --additional-urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core install m5stack:esp32 --additional-urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json

      - name: Install Cardputer libraries
        run: arduino-cli lib install M5Cardputer M5Unified M5GFX

      - name: Compile Neon Bastion for Cardputer ADV (8 MB)
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_cardputer:FlashSize=8M,PartitionScheme=default_8MB" \
            --warnings all \
            --output-dir build/NeonBastion \
            firmware/NeonBastion

      - name: Upload Neon Bastion firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Bastion-Cardputer-ADV-8MB
          path: build/NeonBastion/*.bin
          if-no-files-found: error
          retention-days: 30
