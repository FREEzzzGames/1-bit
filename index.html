/* Physical handheld redesign — visual layer only; game logic and canvas untouched. */
:root{
  --shell-a:#343943;--shell-b:#171a20;--trim:#626975;
  --button-top:#3b414b;--button-bottom:#171a20;--button-edge:#747c89;
  --button-glow:#ffffff18;--cream:#f3efdf;--accent:#b9c4ce;
}
html,body{background:#08090c}

  padding:0;
  background:
    radial-gradient(ellipse at 50% 35%,#252a32 0%,#101216 55%,#050608 100%);

    linear-gradient(90deg,#ffffff08 0 1px,transparent 1px calc(100% - 2px),#0005 calc(100% - 2px)),
    linear-gradient(145deg,var(--shell-a) 0%,#252932 18%,var(--shell-b) 72%,#282d35 100%);

    0 0 0 1px #777e8a55,

    inset 0 2px 1px #ffffff22,
    inset 0 -5px 12px #0008;
}
.console:before{
  content:"SHADOW SPIRE  •  1-BIT SYSTEM";
  top:calc(env(safe-area-inset-top) + 11px);
  left:56px;right:56px;
  color:#c0c5cd;
  font-size:clamp(8px,2vw,10px);
  letter-spacing:.2em;
  text-shadow:0 1px 1px #000;
}
.console:after{
  content:"";

  z-index:-1;
  border:1px solid #ffffff0b;
  border-radius:24px;

  box-shadow:inset 0 0 0 1px #0005;

function hMenu(vx,vy){if(state===ST.PAUSE){SFX.ui();state=ST.PLAY;stateT=0;return}if(state===ST.MENU){SFX.ui();if(save.unlocked>1&&vx>VW/2-60&&vx<VW/2+60&&vy>VH-46&&vy<VH-26){state=ST.LEVELS;stateT=0}else if(save.unlocked>1){state=ST.LEVELS;stateT=0}else stl(0);return}if(state===ST.LEVELS){if(vx<34&&vy<24){SFX.ui();state=ST.MENU;stateT=0;return}const cols=2,tw2=34,th=18,gap=4,tW=cols*tw2+(cols-1)*gap,sX=Math.round((VW-tW)/2),sY=34;for(let i=0;i<LVS.length;i++){const col=i%cols,row=Math.floor(i/cols),x=sX+col*(tw2+gap),y=sY+row*(th+gap);if(vx>=x&&vx<=x+tw2&&vy>=y&&vy<=y+th){if(i<save.unlocked){SFX.ui();stl(i)}return}}return}if(state===ST.DEAD){SFX.ui();stl(levelIndex);return}if(state===ST.WIN){SFX.ui();if(levelIndex+1<LVS.length)stl(levelIndex+1);else{state=ST.ENDING;stateT=0}return}if(state===ST.ENDING){SFX.ui();state=ST.MENU;stateT=0}}
function onDown(e){e.preventDefault();ia();const v=tV(e.clientX,e.clientY);if(state===ST.MENU||state===ST.LEVELS||state===ST.DEAD||state===ST.WIN||state===ST.ENDING||state===ST.PAUSE){hMenu(v.x,v.y);return}if(state===ST.PLAY){const id=hB(v.x,v.y);if(id){pts.set(e.pointerId,id);if(cv.setPointerCapture){try{cv.setPointerCapture(e.pointerId)}catch(_){}}prB(id)}}}
function onUp(e){e.preventDefault();const id=pts.get(e.pointerId);if(id){rlB(id);pts.delete(e.pointerId)}}
function onMove(e){e.preventDefault();if(state!==ST.PLAY)return;const id=pts.get(e.pointerId);if(!id||id==='jump'||id==='lantern'||id==='pause')return;const v=tV(e.clientX,e.clientY),nid=hB(v.x,v.y);if(nid!==id&&(nid==='left'||nid==='right')){rlB(id);pts.set(e.pointerId,nid);prB(nid)}}
function onCancel(e){const id=pts.get(e.pointerId);if(id){rlB(id);pts.delete(e.pointerId)}}
function onKD(e){ia();const k=e.key.toLowerCase();if(state===ST.PAUSE){if(k==='escape'||k===' '||k==='enter'){e.preventDefault();state=ST.PLAY;stateT=0}return}if(state===ST.MENU||state===ST.LEVELS||state===ST.DEAD||state===ST.WIN||state===ST.ENDING){if(k===' '||k==='enter'){e.preventDefault();if(state===ST.LEVELS)stl(0);else hMenu(VW/2,VH/2)}return}if(k==='arrowleft'||k==='a'){I.left=true;e.preventDefault()}else if(k==='arrowright'||k==='d'){I.right=true;e.preventDefault()}else if(k==='arrowup'||k==='w'||k===' '){if(!I.jump)I.jumpPressed=true;I.jump=true;e.preventDefault()}else if(k==='f'){I.lanternPressed=true;e.preventDefault()}else if(k==='escape'){state=ST.PAUSE;stateT=0;I.left=I.right=I.jump=false;I.jumpPressed=I.lanternPressed=false;pts.clear()}}
function onKU(e){const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')I.left=false;else if(k==='arrowright'||k==='d')I.right=false;else if(k==='arrowup'||k==='w'||k===' ')I.jump=false}
function iStars(){stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*VW,y:Math.random()*VH*.75,s:Math.random()})}
const consoleShell=document.querySelector('.console'),skinPicker=document.getElementById('skinPicker'),skinOpen=document.getElementById('skinOpen'),skinOptions=[...document.querySelectorAll('[data-skin-choice]')];
function applySkin(name){if(!skinOptions.some(b=>b.dataset.skinChoice===name))name='dark';consoleShell.dataset.skin=name;skinOptions.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.skinChoice===name)));try{localStorage.setItem('shadowSpireConsoleSkin',name)}catch(_){}}
let savedSkin='dark';try{savedSkin=localStorage.getItem('shadowSpireConsoleSkin')||'dark'}catch(_){}applySkin(savedSkin);
skinOpen.addEventListener('click',()=>{const open=!skinPicker.classList.contains('open');skinPicker.classList.toggle('open',open);skinOpen.setAttribute('aria-expanded',String(open));skinOpen.textContent=open?'SKINS ×':'SKINS ▾'});
skinOptions.forEach(b=>b.addEventListener('click',()=>{applySkin(b.dataset.skinChoice);skinPicker.classList.remove('open');skinOpen.setAttribute('aria-expanded','false');skinOpen.textContent='SKINS ▾'}));
ls();rs();bpt();iStars();
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointercancel',onCancel,{passive:false});
cv.addEventListener('pointerleave',onCancel,{passive:false});
document.querySelectorAll('[data-control]').forEach(el=>{const id=el.dataset.control;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ia();el.classList.add('pressed');try{el.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,id);if(state!==ST.PLAY){if(id==='jump'){if(state===ST.LEVELS){if(save.unlocked>0){SFX.ui();stl(0)}}else hMenu(VW/2,VH/2)}else if(id==='pause'&&state===ST.PAUSE){state=ST.PLAY;stateT=0;SFX.ui()}else if(id==='pause'&&state===ST.LEVELS){state=ST.MENU;stateT=0;SFX.ui()}}else if(id==='pause'&&state===ST.PAUSE){state=ST.PLAY;stateT=0;SFX.ui()}else prB(id)},{passive:false});const release=e=>{e.preventDefault();el.classList.remove('pressed');rlB(id);pts.delete(e.pointerId)};el.addEventListener('pointerup',release,{passive:false});el.addEventListener('pointercancel',release,{passive:false});el.addEventListener('lostpointercapture',()=>{el.classList.remove('pressed');rlB(id)})});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',onKD,{passive:false});
window.addEventListener('keyup',onKU,{passive:false});
window.addEventListener('resize',()=>{rs();iStars()});
window.addEventListener('blur',()=>{I.left=I.right=I.jump=false;I.jumpPressed=I.lanternPressed=false;pts.clear();document.querySelectorAll('.hw-btn.pressed').forEach(el=>el.classList.remove('pressed'))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){I.left=I.right=I.jump=false;I.jumpPressed=I.lanternPressed=false;pts.clear();document.querySelectorAll('.hw-btn.pressed').forEach(el=>el.classList.remove('pressed'))}});
window.addEventListener('orientationchange',()=>setTimeout(()=>{rs();iStars()},200));
document.addEventListener('touchstart',e=>{if(e.target===cv)e.preventDefault()},{passive:false});
requestAnimationFrame(loop);
})();
