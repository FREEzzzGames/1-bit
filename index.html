<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000"><title>FREEzzz ARCADE — Game Select</title>
<link rel="stylesheet" href="./assets/console.css?v=26"></head>
<body class="menu-home"><main class="console" data-shell-skin="dark" data-pad-skin="graphite"><img class="shell-art" src="./assets/console-shell.svg?v=20" alt="" aria-hidden="true"><img class="shell-skin-art" src="./assets/console-shell.svg?v=20" alt="" aria-hidden="true"><div class="deck-tint" aria-hidden="true"></div><div class="style-tools" aria-label="Appearance settings">
  <button class="style-trigger" id="shellSkinOpen" type="button" aria-expanded="false" aria-controls="shellSkinPicker">SHELL SKIN ▾</button>
  <span class="style-trigger game-switch-trigger menu-mode-label">GAME SELECT</span>
  <button class="style-trigger" id="padSkinOpen" type="button" aria-expanded="false" aria-controls="padSkinPicker">PAD SKIN ▾</button>
</div>
<div class="style-picker shell-picker" id="shellSkinPicker" role="group" aria-label="Console shell skins">
  <div class="style-picker-title">CONSOLE SHELL <span>5 SKINS</span></div>
  <button class="style-option" type="button" data-shell-skin="dark" aria-pressed="true"><i class="style-swatch sw-dark"></i>DARK TITANIUM</button>
  <button class="style-option" type="button" data-shell-skin="arctic" aria-pressed="false"><i class="style-swatch sw-arctic"></i>ARCTIC CYAN</button>
  <button class="style-option" type="button" data-shell-skin="ember" aria-pressed="false"><i class="style-swatch sw-ember"></i>EMBER</button>
  <button class="style-option" type="button" data-shell-skin="forest" aria-pressed="false"><i class="style-swatch sw-forest"></i>FOREST</button>
  <button class="style-option" type="button" data-shell-skin="violet" aria-pressed="false"><i class="style-swatch sw-violet"></i>NEBULA VIOLET</button>
</div>
<div class="style-picker pad-picker" id="padSkinPicker" role="group" aria-label="Control panel skins">
  <div class="style-picker-title">CONTROL PANEL <span>5 SKINS</span></div>
  <button class="style-option" type="button" data-pad-skin="graphite" aria-pressed="true"><i class="style-swatch sw-dark"></i>GRAPHITE</button>
  <button class="style-option" type="button" data-pad-skin="cyan" aria-pressed="false"><i class="style-swatch sw-arctic"></i>CYBER CYAN</button>
  <button class="style-option" type="button" data-pad-skin="amber" aria-pressed="false"><i class="style-swatch sw-ember"></i>AMBER CIRCUIT</button>
  <button class="style-option" type="button" data-pad-skin="violet" aria-pressed="false"><i class="style-swatch sw-violet"></i>VIOLET NEON</button>
  <button class="style-option" type="button" data-pad-skin="ivory" aria-pressed="false"><i class="style-swatch sw-ivory"></i>RETRO IVORY</button>
</div><div class="screen-bezel"><canvas id="c"></canvas></div><section class="controls" aria-label="Console controls"><div class="dpad" aria-label="Movement"><button class="hw-btn left" data-control="left" aria-label="Move left">◀</button><span class="dpad-core" aria-hidden="true">✦</span><button class="hw-btn right" data-control="right" aria-label="Move right">▶</button></div><div class="action-cluster"><button class="hw-btn action-main" data-control="jump" aria-label="Jump or interact">ACTION</button><div class="utility-row"><button class="hw-btn utility" data-control="lantern" aria-label="Toggle lamp">☼<small>LAMP</small></button><button class="hw-btn utility" data-control="pause" aria-label="Pause">Ⅱ<small>PAUSE</small></button></div></div></section></main><script defer src="./assets/skins.js?v=20"></script><script defer src="./assets/control-layout.js?v=4"></script><script defer src="./assets/game-screen.js?v=1"></script><script defer src="./assets/console-menu.js?v=2"></script></body></html>
